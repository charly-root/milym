services:
  app:
    build: .
    restart: unless-stopped
    # Traefik (host network) reverse-proxy vers ce port local
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: "${NODE_ENV:-production}"
    volumes:
      - milym_data:/app/data
      - milym_logos:/app/public/logos
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  milym_data:
  milym_logos:
